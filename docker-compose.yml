services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sku
      POSTGRES_PASSWORD: sku
      POSTGRES_DB: sku_hierarchy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sku"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sku:sku@db:5432/sku_hierarchy
      AUTH_USERNAME: admin
      AUTH_PASSWORD: admin123
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
